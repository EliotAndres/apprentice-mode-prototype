[project]
name = "apprentice-mode-prototype"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "huggingface-hub>=2.2.0",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["data-generation", "evaluation", "visualization"]
testpaths = ["tests"]
